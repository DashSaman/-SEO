services:
  app:
    image: ghcr.io/activepieces/activepieces:0.86.3
    container_name: growthos-activepieces-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    env_file: .env
    environment:
      AP_CONTAINER_TYPE: APP
    volumes:
      - ./cache:/usr/src/app/cache
    networks:
      - activepieces

  worker:
    image: ghcr.io/activepieces/activepieces:0.86.3
    container_name: growthos-activepieces-worker
    restart: unless-stopped
    depends_on:
      - app
    env_file: .env
    environment:
      AP_CONTAINER_TYPE: WORKER
      AP_FRONTEND_URL: http://app
      AP_WORKER_CONCURRENCY: "1"
      AP_EXECUTION_MODE: SANDBOX_CODE_ONLY
    volumes:
      - ./cache:/usr/src/app/cache
    networks:
      - activepieces

  postgres:
    image: pgvector/pgvector:0.8.0-pg14
    container_name: growthos-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${AP_POSTGRES_DATABASE}
      POSTGRES_USER: ${AP_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - activepieces

  redis:
    image: redis:7.0.7
    container_name: growthos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - activepieces

volumes:
  postgres_data:
  redis_data:

networks:
  activepieces:
