services:
  dockge:
    image: louislam/dockge:1
    container_name: growthos-dockge
    restart: unless-stopped
    ports:
      - "0.0.0.0:5001:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - /opt/stacks:/opt/stacks
    environment:
      DOCKGE_STACKS_DIR: /opt/stacks
      PUID: "1000"
      PGID: "1000"
