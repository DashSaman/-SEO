<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#0d1117"/>
  <text x="60" y="70" fill="#ffffff" font-family="Segoe UI,Arial" font-size="34" font-weight="700">WSL2 Resource Limits — Pilot Machine</text>
  <text x="60" y="115" fill="#aab2bf" font-family="Segoe UI,Arial" font-size="22">Ryzen 7 6800H • 32 GB RAM • RTX 3070 8 GB</text>
  <rect x="60" y="160" width="500" height="350" rx="20" fill="#161b22" stroke="#30363d"/>
  <text x="90" y="210" fill="#58a6ff" font-family="Consolas,monospace" font-size="24">%UserProfile%\.wslconfig</text>
  <text x="90" y="265" fill="#f0f6fc" font-family="Consolas,monospace" font-size="28">[wsl2]</text>
  <text x="90" y="310" fill="#f0f6fc" font-family="Consolas,monospace" font-size="28">memory=20GB</text>
  <text x="90" y="355" fill="#f0f6fc" font-family="Consolas,monospace" font-size="28">processors=12</text>
  <text x="90" y="400" fill="#f0f6fc" font-family="Consolas,monospace" font-size="28">swap=8GB</text>
  <text x="90" y="445" fill="#f0f6fc" font-family="Consolas,monospace" font-size="28">localhostForwarding=true</text>
  <rect x="640" y="160" width="500" height="350" rx="20" fill="#161b22" stroke="#30363d"/>
  <text x="675" y="215" fill="#3fb950" font-family="Segoe UI,Arial" font-size="25" font-weight="700">Why these limits?</text>
  <text x="675" y="270" fill="#f0f6fc" font-family="Segoe UI,Arial" font-size="22">WSL max RAM: 20 GB</text>
  <text x="675" y="310" fill="#f0f6fc" font-family="Segoe UI,Arial" font-size="22">Windows reserve: about 12 GB</text>
  <text x="675" y="350" fill="#f0f6fc" font-family="Segoe UI,Arial" font-size="22">WSL CPU threads: 12 / 16</text>
  <text x="675" y="390" fill="#f0f6fc" font-family="Segoe UI,Arial" font-size="22">Swap safety buffer: 8 GB</text>
  <text x="675" y="430" fill="#f0f6fc" font-family="Segoe UI,Arial" font-size="22">Good balance for Docker + agents</text>
  <text x="60" y="575" fill="#d29922" font-family="Segoe UI,Arial" font-size="24" font-weight="700">Apply changes</text>
  <text x="60" y="620" fill="#f0f6fc" font-family="Consolas,monospace" font-size="26">wsl --shutdown</text>
  <text x="330" y="620" fill="#8b949e" font-family="Segoe UI,Arial" font-size="24">→ relaunch Ubuntu → verify with free -h / nproc / swapon --show</text>
  <text x="60" y="680" fill="#8b949e" font-family="Segoe UI,Arial" font-size="18">Do not install Docker until verification passes.</text>
</svg>